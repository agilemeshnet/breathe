[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "breathe-memory"
version = "0.1.0"
description = "Memory frameworks retrieve. Breathe remembers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "AgileMesh", email = "agilemeshnet@gmail.com"}]
keywords = ["ai", "memory", "context-window", "extended-mind", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
mcp = ["mcp[server]>=1.0"]
neo4j = ["neo4j>=5.0"]
faiss = ["faiss-cpu>=1.7"]

[project.urls]
Homepage = "https://github.com/agilemeshnet/breathe"
Documentation = "https://github.com/agilemeshnet/breathe#readme"

[tool.setuptools.packages.find]
include = ["core*", "adapters*", "hooks*", "mcp*"]
